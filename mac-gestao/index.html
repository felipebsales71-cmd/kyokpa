<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061315"><title>MAC Gestão</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061315;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.box{text-align:center;padding:24px}.spin{width:38px;height:38px;border:3px solid #16383d;border-top-color:#24b8c8;border-radius:50%;animation:s .9s linear infinite;margin:0 auto 16px}@keyframes s{to{transform:rotate(360deg)}}b{font-size:22px}small{display:block;margin-top:7px;color:#8ca5aa}</style></head><body><div class="box"><div class="spin"></div><b>MAC Gestão</b><small>Carregando sua inteligência financeira...</small></div><script>
(async()=>{try{
const parts=await Promise.all([1,2,3,4].map(n=>fetch('payload'+n+'.txt?v=personal-1').then(r=>{if(!r.ok)throw new Error('payload '+n);return r.text()})));
const b64=parts.join('').replace(/\s/g,'');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
const newCalc=`function calcIR(receipts,legalDeductions){const mode=state.fiscal.calculationMode||'fixed',rate=Number(state.fiscal.fixedRate??27.5),fixedBase=state.fiscal.fixedBase||'gross';if(mode==='manual'){const due=Math.max(0,Number(state.fiscal.manualTax)||0);return{receipts,used:0,base:receipts,gross:due,reduction:0,due,effective:receipts?due/receipts*100:0,method:'Valor mensal definido manualmente'}}if(mode==='fixed'){const used=fixedBase==='net'?Math.max(0,legalDeductions):0,base=Math.max(0,receipts-used),due=base*Math.max(0,rate)/100;return{receipts,used,base,gross:due,reduction:0,due,effective:receipts?due/receipts*100:0,method:'Alíquota personalizada de '+rate.toFixed(2).replace('.',',')+'%'}}const simpl=Number(state.fiscal.simplifiedDiscount??607.20),used=Math.max(simpl,Math.max(0,legalDeductions)),base=Math.max(0,receipts-used);let gross=0;if(base<=2428.80)gross=0;else if(base<=2826.65)gross=base*.075-182.16;else if(base<=3751.05)gross=base*.15-394.16;else if(base<=4664.68)gross=base*.225-675.49;else gross=base*.275-908.73;gross=Math.max(0,gross);let reduction=0;if(receipts<=5000)reduction=Math.min(gross,312.89);else if(receipts<=7350)reduction=Math.max(0,978.62-(.133145*receipts));reduction=Math.min(gross,reduction);const due=Math.max(0,gross-reduction);return{receipts,used,base,gross,reduction,due,effective:receipts?due/receipts*100:0,method:'Tabela progressiva 2026'}}`;
html=html.replace(/function calcIR\(receipts,legalDeductions\)\{[\s\S]*?\}\nfunction stats\(\)/,newCalc+'\nfunction stats()');
html=html.replace('(state.fiscal.dependents||0)*189.59+book','(state.fiscal.dependents||0)*(state.fiscal.dependentDeduction??189.59)+book');
const newFiscal=`function openFiscalSettings(){document.getElementById('modalRoot').innerHTML=\`<div class="modal-backdrop"><form class="modal wide" onsubmit="saveFiscal(event)"><div class="modal-head"><div><h2>Configuração fiscal</h2><p>Nenhuma regra fica travada. Ajuste o cálculo ao perfil real do Marco.</p></div><button type="button" class="close" onclick="closeModal()">×</button></div><div class="calc-grid"><div class="field"><label>Modo de cálculo</label><select id="fMode"><option value="fixed" \\${(state.fiscal.calculationMode||'fixed')==='fixed'?'selected':''}>Alíquota personalizada</option><option value="progressive" \\${state.fiscal.calculationMode==='progressive'?'selected':''}>Tabela progressiva 2026</option><option value="manual" \\${state.fiscal.calculationMode==='manual'?'selected':''}>Valor mensal manual</option></select></div><div class="field"><label>Alíquota personalizada (%)</label><input id="fRate" type="number" step="0.01" min="0" max="100" value="\\${state.fiscal.fixedRate??27.5}"></div><div class="field"><label>Aplicar taxa sobre</label><select id="fBase"><option value="gross" \\${(state.fiscal.fixedBase||'gross')==='gross'?'selected':''}>Receita considerada</option><option value="net" \\${state.fiscal.fixedBase==='net'?'selected':''}>Base após deduções</option></select></div><div class="field"><label>Imposto mensal manual</label><input id="fManual" type="number" step="0.01" min="0" value="\\${state.fiscal.manualTax||0}"></div><div class="field"><label>Previdência oficial mensal</label><input id="fPrev" type="number" value="\\${state.fiscal.previd}"></div><div class="field"><label>Dependentes</label><input id="fDeps" type="number" min="0" value="\\${state.fiscal.dependents}"></div><div class="field"><label>Dedução por dependente</label><input id="fDepDed" type="number" step="0.01" value="\\${state.fiscal.dependentDeduction??189.59}"></div><div class="field"><label>Pensão alimentícia</label><input id="fPension" type="number" value="\\${state.fiscal.pension}"></div><div class="field"><label>Desconto simplificado</label><input id="fSimpl" type="number" step="0.01" value="\\${state.fiscal.simplifiedDiscount??607.20}"></div><div class="field"><label>Margem de segurança (%)</label><input id="fSafety" type="number" min="0" max="100" value="\\${state.fiscal.safety}"></div></div><div class="tax-warning" style="margin-top:12px">A demonstração começa em <strong>27,5%</strong>, mas a alíquota, a base, as deduções, a margem e até o valor mensal podem ser alterados.</div><div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary">Salvar e recalcular tudo</button></div></form></div>\`}
function saveFiscal(e){e.preventDefault();state.fiscal.calculationMode=fMode.value;state.fiscal.fixedRate=+fRate.value||0;state.fiscal.fixedBase=fBase.value;state.fiscal.manualTax=+fManual.value||0;state.fiscal.previd=+fPrev.value||0;state.fiscal.dependents=+fDeps.value||0;state.fiscal.dependentDeduction=+fDepDed.value||0;state.fiscal.pension=+fPension.value||0;state.fiscal.simplifiedDiscount=+fSimpl.value||0;state.fiscal.safety=+fSafety.value||0;save();closeModal();renderDashboard();toast('Regra fiscal atualizada e projeções recalculadas.')}`;
html=html.replace(/function openFiscalSettings\(\)\{[\s\S]*?\}\nfunction saveFiscal\(e\)\{[\s\S]*?\}\nfunction reserveTax/,newFiscal+'\nfunction reserveTax');
html=html.replace(/Tabela IRPF 2026 carregada/g,'Regra fiscal personalizada');
html=html.replace(/Estimativa de Carnê-Leão — mês atual/g,'Estimativa de imposto — mês atual');
html=html.replace(/Imposto antes da redução 2026/g,'Imposto calculado');
html=html.replace(/Redução mensal 2026/g,'Ajustes / redução');
html=html.replace(/Simulador 2026/g,'Simulador personalizado');
html=html.replace(/Dedução mensal de R\$ 189,59 por dependente na tabela 2026\./g,'Valor de dedução por dependente configurável.');
html=html.replace(/IRPF 2026/g,'IMPOSTO PERSONALIZADO');
document.open();document.write(html);document.close();
}catch(e){console.error(e);document.body.innerHTML='<div class="box"><b>Não foi possível carregar o MAC Gestão.</b><small>Atualize a página ou abra no Chrome/Safari mais recente.</small></div>'}})();
</script></body></html>
