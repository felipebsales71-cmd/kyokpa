<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061315"><title>MAC Gestão</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061315;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.box{text-align:center;padding:24px}.spin{width:38px;height:38px;border:3px solid #16383d;border-top-color:#24b8c8;border-radius:50%;animation:s .9s linear infinite;margin:0 auto 16px}@keyframes s{to{transform:rotate(360deg)}}b{font-size:22px}small{display:block;margin-top:7px;color:#8ca5aa}</style></head><body><div class="box"><div class="spin"></div><b>MAC Gestão</b><small>Carregando sua inteligência financeira...</small></div><script>(async()=>{try{const parts=await Promise.all([1,2,3,4].map(n=>fetch('payload'+n+'.txt?v=personal-1').then(r=>{if(!r.ok)throw new Error('payload '+n);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<div class="box"><b>Não foi possível carregar o MAC Gestão.</b><small>Atualize a página ou abra no Chrome/Safari mais recente.</small></div>'}})();</script></body></html>
